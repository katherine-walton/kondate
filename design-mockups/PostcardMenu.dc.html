<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Kondate menu — Postcard</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#2B2823}a:hover{color:#000}
</style>
</helmet>
<div style="width: 100%; min-height: 100%; background: #F6F3ED; color: #2B2823; font-family: 'DM Mono', 'SFMono-Regular', Menlo, Consolas, monospace; box-sizing: border-box; padding: 32px 20px 72px">
<div style="max-width: 1124px; margin: 0 auto; display: flex; flex-direction: column; gap: 28px">

<header style="display: flex; align-items: center; justify-content: space-between; gap: 16px">
<h1 style="margin: 0; font-size: 22px; font-weight: 500; letter-spacing: 0.04em; text-transform: uppercase">Kondate</h1>
<a href="PostcardList.dc.html" aria-label="Open grocery list, 2 recipes" style="box-sizing: border-box; text-decoration: none; height: 44px; padding: 0 16px; border: 1px solid #2B2823; background: transparent; color: #2B2823; font-family: inherit; font-size: 13px; letter-spacing: 0.06em; text-transform: uppercase; display: flex; align-items: center; gap: 10px; cursor: pointer">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 8h14l-1.2 12H6.2z"></path><path d="M9 8a3 3 0 0 1 6 0"></path></svg>
<span>List (2)</span>
</a>
</header>

<main style="display: grid; grid-template-columns: repeat(auto-fill, minmax(min(340px, 100%), 1fr)); gap: 16px">
<sc-for list="{{items}}" as="item" hint-placeholder-count="6">
<a href="PostcardDetail.dc.html" style="display: flex; flex-direction: column; text-decoration: none; color: inherit; background: #F9F7F2; border: 1px solid #2B2823">
<div style="padding: 14px 16px; display: flex; flex-direction: column; gap: 6px">
<span style="font-size: 11px; letter-spacing: 0.06em; color: #5E5A52">NO. {{item.no}}</span>
<h3 style="margin: 0; font-size: 15px; font-weight: 500; line-height: 1.35; letter-spacing: 0.02em; text-transform: uppercase; text-wrap: pretty">{{item.name}}</h3>
</div>
<div style="border-top: 1px solid #2B2823; padding: 12px 16px; display: flex; flex-wrap: wrap; gap: 6px 18px; font-size: 13px">
<sc-if value="{{item.protein}}" hint-placeholder-val="{{ true }}">
<span style="display: flex; align-items: center; gap: 6px"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M12 3.5c3.4 0 6 4.8 6 8.8a6 6 0 0 1-12 0c0-4 2.6-8.8 6-8.8z"></path></svg>High protein</span>
</sc-if>
<sc-if value="{{item.quick}}" hint-placeholder-val="{{ true }}">
<span style="display: flex; align-items: center; gap: 6px"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><circle cx="12" cy="12" r="8.5"></circle><path d="M12 7.5V12l3 2"></path></svg>Quick</span>
</sc-if>
<sc-if value="{{item.fiber}}" hint-placeholder-val="{{ false }}">
<span style="display: flex; align-items: center; gap: 6px"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 19c0-8 5-13 14-14-1 9-6 14-14 14z"></path><path d="M5 19l7-7"></path></svg>High fiber</span>
</sc-if>
</div>
<div style="border-top: 1px solid #2B2823; padding: 12px">
<div style="aspect-ratio: 1 / 1; width: 100%; background: #E6E0D5; display: flex; align-items: center; justify-content: center; font-size: 11px; letter-spacing: 0.16em; color: #5E5A52">PHOTO</div>
</div>
</a>
</sc-for>
</main>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":1720}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      items: [
        { no: '01', name: 'Miso salmon rice bowl', protein: true, quick: true, fiber: false },
        { no: '02', name: 'Chicken & farro grain bowl', protein: true, quick: false, fiber: true },
        { no: '03', name: 'Soba with sesame greens', protein: false, quick: true, fiber: true },
        { no: '04', name: 'Turkey taco rice bowl', protein: true, quick: true, fiber: false },
        { no: '05', name: 'Tofu & kabocha curry', protein: false, quick: false, fiber: true },
        { no: '06', name: 'Ginger pork donburi', protein: true, quick: true, fiber: false },
        { no: '07', name: 'Lentil & roasted vegetable bowl', protein: true, quick: false, fiber: true },
        { no: '08', name: 'Egg & avocado morning bowl', protein: true, quick: true, fiber: false }
      ]
    };
  }
}
</script>
</body>
</html>
